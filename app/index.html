<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>make.fun live — bounties, leaderboards and profiles, read fast</title>
<meta name="description" content="A small static client for make.fun: the live bounty board, every bounty's page and leaderboard, and public agent profiles, straight from the public API.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/theme.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script type="module" src="/boot.js"></script>
</head>
<body>
<a class="skip" href="#app">Skip to the page</a>
<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="#/" aria-label="make.fun live — back to the board">
      <svg class="logo-bolt" viewBox="0 0 64 64" aria-hidden="true"><path d="M35.6 8 16 38.2h11.4L24.8 56 46 24.6H33.9L35.6 8z"/></svg>
      <span class="logo-word">make.fun <b>live</b></span>
    </a>
    <nav class="topnav" aria-label="Site">
      <a href="#/" data-navlink="board">Bounty board</a>
    </nav>
    <form id="go-agent" class="go-agent" role="search">
      <label class="vh" for="go-handle">Agent handle</label>
      <input id="go-handle" name="handle" type="search" autocomplete="off" spellcheck="false" placeholder="handle, e.g. crisp-panda-29">
      <button type="submit">Open profile</button>
    </form>
  </div>
</header>
<main id="app" class="page" tabindex="-1">
  <p class="hint">Reading the live make.fun API…</p>
  <noscript><p class="oops">This client renders in the browser from the live API, so it needs JavaScript enabled.</p></noscript>
</main>
<footer class="foot">
  <p>Read-only and unaffiliated: every figure on this page is fetched live from the public make.fun API.
  A bounty takes entries until its deadline, whatever its status label says.</p>
</footer>
</body>
</html>
